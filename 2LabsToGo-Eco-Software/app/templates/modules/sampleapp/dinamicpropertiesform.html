{% load static %}
<form class="volume-calculation-parameter" id='movementform'>
    <div class="alert alert-warning alert-dismissible collapse" id='id_motor_speed_error' role="alert">
        Set the motor speed to a value between 5 and 50 mm/s!
    </div>
    <div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_motor_speed" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">XY Motor Speed</label>
            <input type="number" name="motor_speed" value="16" class="form-control" step="1" required="" id="id_motor_speed">
            <div class="input-group-append">
                <span class="input-group-text">mm/s</span>
            </div>
        </div>
    </div>
    <div class="form-group row"  style="display: none;">
        <div class="input-group input-group-sm">
            <label for="id_pressure" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate" >Pressure</label>
            <input type="number" name="pressure" value="5" class="form-control change-volume-parameter" step="1" required="" id="id_pressure">
            <div class="input-group-append">
                <span class="input-group-text">psi</span>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_frequency" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Frequency</label>
            <input type="number" name="frequency" value="1000" class="form-control change-volume-parameter" step="1" required="" id="id_frequency">
            <div class="input-group-append">
                <span class="input-group-text">Hz</span>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_delta_y" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Delta Y</label>
            <input type="number" name="delta_y" value="0.75" class="form-control change-volume-parameter" step="0.01" required="" id="id_delta_y">
            <div class="input-group-append">
                <span class="input-group-text">mm</span>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_delta_x" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Delta X</label>
            <input type="number" name="delta_x" value="0.75" class="form-control change-volume-parameter" step="0.01" required="" id="id_delta_x">
            <div class="input-group-append">
                <span class="input-group-text">mm</span>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_temperature" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Temperature</label>
            <input type="number" name="temperature" value="0" class="form-control" step="1" id="id_temperature">
            <div class="input-group-append">
                <span class="input-group-text">°C</span>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_nozzlediameter" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Nozzle</label>
            <select name="nozzlediameter" class="form-control change-volume-parameter" maxlength="120" id="id_nozzlediameter">
                <option value="0.13" selected="">0.13</option>
                <option value="0.10">0.10</option>
                <option value="0.08">0.08</option>
                <!--<option value="0.05">0.05</option>-->
            </select>
            <div class="input-group-append">
                <span class="input-group-text">mm</span>
            </div>
        </div>
    </div>
    <div class="form-group row" style="display: yes;">
        <div class="input-group input-group-sm">
            <label for="id_rinsingperiod" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Rinsing Period</label>
            <input type="number" name="rinsingPeriod" value="99999" class="form-control" step="1" id="id_rinsingperiod">
            <div class="input-group-append">
                <span class="input-group-text">#passes</span>
            </div>
        </div>
    </div>
    <div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_rinsingSolvent" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Rinsing Solvent</label>
            <select name="rinsingSolvent" class="form-control change-volume-parameter" maxlength="120" id="id_rinsingSolvent">
                <option value="Acetone" selected="">Acetone</option>
                <option value="Acetonitrile" selected="">Acetonitrile</option>
				<!--<option value="2-Butanol">2-Butanol</option>-->
                <option value="Ethanol">Ethanol</option>
                <option value="Ethyl acetate">Ethyl acetate</option>
                <option value="Methanol">Methanol</option>
                <option value="2-Propanol">2-Propanol</option>
                <option value="Water">Water</option>
				<option value="Cyclohexane">Cyclohexane</option>
				<option value="Toluene">Toluene</option>
            </select>
		</div>
	</div>
    <div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_rinsingFactor" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Rinsing Volume</label>
            <input type="number" name="rinsingFactor" value="1.5" class="form-control" step="0.1" id="id_rinsingfactor">
            <div class="input-group-append">
                <span class="input-group-text">mL</span>
            </div>
        </div>
    </div>
	<div class="form-group row">
        <div class="input-group input-group-sm">
            <label for="id_vialtype" class="col-xl-3 col-lg-5 col-form-label col-form-label-sm text-truncate">Vial Type</label>
            <select name="vialtype" class="form-control change-volume-parameter" maxlength="120" id="id_vialtype">
                <option value="0.0">Vials vertical</option>
                <option value="1.7">Vials at 8°</option>
            </select>
        </div>
    </div>
</form>
